name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    check:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                # The oldest and newest Node versions with synchronous module hooks.
                node-version: [22, 24]
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm fmt
            - run: pnpm typecheck
            # Builds the module and the playground, then checks the spans the built server sends.
            - run: pnpm test
